name: esphome-mcp

services:
  esphome-mcp:
    # For local development, build from source:
    build: .
    # In production, prefer the published image (uncomment and pin a tag):
    # image: ghcr.io/loryanstrant/esphome-mcp:latest
    container_name: esphome-mcp
    restart: unless-stopped
    env_file: .env
    environment:
      # Configure the port (default 8080). Set to avoid conflicts with other services.
      # MCP_PORT: "8080"
    ports:
      - "${MCP_PORT:-8080}:${MCP_PORT:-8080}"
    healthcheck:
      test: ["CMD", "python", "healthcheck.py"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
